events{}

http {
    server{
        listen 80;
        location / {
            proxy_pass http://frontend:80;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend:8000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

#Utilizziamo come URL "frontend" e "backend" anche se non li abbiamo ancora descritti.
#Questi sono i nomi che assegno ai microservizi che compongono la mia BankingApp, e indicano 
#come saranno riconosciuti sulla rete Docker. 